# Builds seohouse-core.zip from the repository, checks that the content pack is inside and intact,
# and attaches it to the release when a release is published. The plugin folder in the repository is
# complete by itself (content-pack inside), so the release file and a copy of the folder are the same.
name: SEO House Core zip
on:
  push:
    branches: ['**']
    paths: ['wordpress/plugins/seohouse-core/**', 'tools/package-core.py', 'tools/verify-core-zip.py', 'tools/design-import/finalize-pack.py']
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Content pack finalized (ASCII names, integrity list)
        run: python3 tools/design-import/finalize-pack.py wordpress/plugins/seohouse-core/content-pack --check
      - name: Build and verify
        run: python3 tools/package-core.py . seohouse-core.zip
      - uses: actions/upload-artifact@v4
        with:
          name: seohouse-core
          path: seohouse-core.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" seohouse-core.zip --clobber
